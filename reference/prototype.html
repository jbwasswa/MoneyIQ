<title>Pocket Ledger</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: web app. Wide screens get a dark sidebar, a header with the month switcher, and a dashboard grid. Phones get bottom tabs, a raised add button and a keypad sheet. */
:root{
  --bg:#EDF3F1; --surface:#FFFFFF; --ink:#13211E; --muted:#5B6D69; --line:#D9E3E0;
  --accent:#0B7A63; --accent-ink:#FFFFFF; --inc:#0B7A63; --exp:#B93A32; --xfer:#2878C7; --warn:#A8691A;
  --side:#0F2A25; --side-ink:#DCEDE8; --side-muted:#8DB0A6; --side-hi:rgba(255,255,255,.09); --side-accent:#3CCBA4;
  --shadow:0 18px 50px rgba(19,33,30,.18); --exp-ink:#FFFFFF; --inc-ink:#FFFFFF;
  --f-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --f-body:'Instrument Sans','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1210; --surface:#141F1C; --ink:#E4EEEB; --muted:#8FA29D; --line:#243330;
    --accent:#3CCBA4; --accent-ink:#06251D; --inc:#3CCBA4; --exp:#F0786E; --warn:#E3B04B;
    --side:#08100E; --shadow:0 18px 50px rgba(0,0,0,.6); --exp-ink:#2A0B08; --inc-ink:#06251D; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1210; --surface:#141F1C; --ink:#E4EEEB; --muted:#8FA29D; --line:#243330;
  --accent:#3CCBA4; --accent-ink:#06251D; --inc:#3CCBA4; --exp:#F0786E; --warn:#E3B04B;
  --side:#08100E; --shadow:0 18px 50px rgba(0,0,0,.6); --exp-ink:#2A0B08; --inc-ink:#06251D; color-scheme:dark;
}
/* colour themes: only the accent, tint and sidebar change. Money in stays green and money out stays red in every theme. */
:root[data-palette="ocean"]{--bg:#ECF0F3;--line:#D4DCE2;--ink:#121D26;--muted:#5C6770;--accent:#115088;--accent-ink:#FFFFFF;--side:#121F2B;--side-ink:#D7E1EA;--side-muted:#97A9BA;--side-accent:#5CA2E0}
@media (prefers-color-scheme: dark){:root[data-palette="ocean"]:not([data-theme="light"]){--bg:#0B1014;--surface:#161C22;--ink:#E7EBEF;--muted:#9AA4AC;--line:#283139;--accent:#529EE0;--accent-ink:#091825;--side:#080D11;--side-accent:#529EE0}}
:root[data-palette="ocean"][data-theme="dark"]{--bg:#0B1014;--surface:#161C22;--ink:#E7EBEF;--muted:#9AA4AC;--line:#283139;--accent:#529EE0;--accent-ink:#091825;--side:#080D11;--side-accent:#529EE0}
:root[data-palette="indigo"]{--bg:#ECEDF3;--line:#D4D5E2;--ink:#121426;--muted:#5C5D70;--accent:#111988;--accent-ink:#FFFFFF;--side:#12142B;--side-ink:#D7D8EA;--side-muted:#9799BA;--side-accent:#5C65E0}
@media (prefers-color-scheme: dark){:root[data-palette="indigo"]:not([data-theme="light"]){--bg:#0B0B14;--surface:#161722;--ink:#E7E7EF;--muted:#9A9BAC;--line:#282939;--accent:#7980E7;--accent-ink:#090B25;--side:#080911;--side-accent:#7980E7}}
:root[data-palette="indigo"][data-theme="dark"]{--bg:#0B0B14;--surface:#161722;--ink:#E7E7EF;--muted:#9A9BAC;--line:#282939;--accent:#7980E7;--accent-ink:#090B25;--side:#080911;--side-accent:#7980E7}
:root[data-palette="violet"]{--bg:#EFECF3;--line:#DBD4E2;--ink:#1B1226;--muted:#655C70;--accent:#491188;--accent-ink:#FFFFFF;--side:#1E122B;--side-ink:#E0D7EA;--side-muted:#A797BA;--side-accent:#9A5CE0}
@media (prefers-color-scheme: dark){:root[data-palette="violet"]:not([data-theme="light"]){--bg:#0F0B14;--surface:#1C1622;--ink:#EAE7EF;--muted:#A39AAC;--line:#302839;--accent:#A770E6;--accent-ink:#160925;--side:#0C0811;--side-accent:#A770E6}}
:root[data-palette="violet"][data-theme="dark"]{--bg:#0F0B14;--surface:#1C1622;--ink:#EAE7EF;--muted:#A39AAC;--line:#302839;--accent:#A770E6;--accent-ink:#160925;--side:#0C0811;--side-accent:#A770E6}
:root[data-palette="berry"]{--bg:#F3ECEF;--line:#E2D4DA;--ink:#26121B;--muted:#705C65;--accent:#881145;--accent-ink:#FFFFFF;--side:#2B121D;--side-ink:#EAD7DF;--side-muted:#BA97A6;--side-accent:#E05C95}
@media (prefers-color-scheme: dark){:root[data-palette="berry"]:not([data-theme="light"]){--bg:#140B0F;--surface:#22161B;--ink:#EFE7EA;--muted:#AC9AA2;--line:#39282F;--accent:#E25A95;--accent-ink:#250915;--side:#11080C;--side-accent:#E25A95}}
:root[data-palette="berry"][data-theme="dark"]{--bg:#140B0F;--surface:#22161B;--ink:#EFE7EA;--muted:#AC9AA2;--line:#39282F;--accent:#E25A95;--accent-ink:#250915;--side:#11080C;--side-accent:#E25A95}
:root[data-palette="amber"]{--bg:#F3F0EC;--line:#E2DCD4;--ink:#261D12;--muted:#70675C;--accent:#885411;--accent-ink:#FFFFFF;--side:#2B2012;--side-ink:#EAE2D7;--side-muted:#BAAB97;--side-accent:#E0A75C}
@media (prefers-color-scheme: dark){:root[data-palette="amber"]:not([data-theme="light"]){--bg:#14100B;--surface:#221D16;--ink:#EFEBE7;--muted:#ACA49A;--line:#393228;--accent:#E0A352;--accent-ink:#251909;--side:#110D08;--side-accent:#E0A352}}
:root[data-palette="amber"][data-theme="dark"]{--bg:#14100B;--surface:#221D16;--ink:#EFEBE7;--muted:#ACA49A;--line:#393228;--accent:#E0A352;--accent-ink:#251909;--side:#110D08;--side-accent:#E0A352}
:root[data-palette="forest"]{--bg:#ECF3EE;--line:#D4E2D8;--ink:#122617;--muted:#5C7061;--accent:#10842D;--accent-ink:#FFFFFF;--side:#122B18;--side-ink:#D7EADC;--side-muted:#97BAA0;--side-accent:#5CE07D}
@media (prefers-color-scheme: dark){:root[data-palette="forest"]:not([data-theme="light"]){--bg:#0B140D;--surface:#162219;--ink:#E7EFE9;--muted:#9AAC9F;--line:#28392C;--accent:#52E075;--accent-ink:#092510;--side:#08110B;--side-accent:#52E075}}
:root[data-palette="forest"][data-theme="dark"]{--bg:#0B140D;--surface:#162219;--ink:#E7EFE9;--muted:#9AAC9F;--line:#28392C;--accent:#52E075;--accent-ink:#092510;--side:#08110B;--side-accent:#52E075}
:root[data-palette="slate"]{--bg:#EEEFF2;--line:#D8DBDF;--ink:#121A26;--muted:#5C6470;--accent:#3C4A5D;--accent-ink:#FFFFFF;--side:#121D2B;--side-ink:#D7DFEA;--side-muted:#97A5BA;--side-accent:#5C93E0}
@media (prefers-color-scheme: dark){:root[data-palette="slate"]:not([data-theme="light"]){--bg:#0B0F14;--surface:#161B22;--ink:#E7EAEF;--muted:#9AA2AC;--line:#282F39;--accent:#7A94B8;--accent-ink:#091525;--side:#080C11;--side-accent:#7A94B8}}
:root[data-palette="slate"][data-theme="dark"]{--bg:#0B0F14;--surface:#161B22;--ink:#E7EAEF;--muted:#9AA2AC;--line:#282F39;--accent:#7A94B8;--accent-ink:#091525;--side:#080C11;--side-accent:#7A94B8}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.gx{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
kbd{font:600 11px var(--f-body);border:1px solid currentColor;border-radius:5px;padding:0 5px;opacity:.7;margin-left:6px}
.sep{color:var(--muted);font-weight:400}

#app{position:relative;height:100%;display:flex;flex-direction:column;overflow:hidden}
#side{display:none}
#main{flex:1;min-height:0;min-width:0;display:flex;flex-direction:column}
#screen{flex:1;min-height:0;overflow-y:auto}
.wrap{width:100%;max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:16px;padding-block:8px 28px}
@media (min-width:900px){
  .row.account-row{grid-template-columns:40px minmax(0,1.5fr) minmax(0,1fr) 120px 135px}
  .account-ledger-head{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 120px 135px}

  #app{display:grid;grid-template-columns:248px minmax(0,1fr)}
  #side{display:flex}
  #tabs{display:none!important}
  #main .gx{padding-left:max(30px,env(safe-area-inset-left,0px));padding-right:max(30px,env(safe-area-inset-right,0px))}
}

/* sidebar */
#side{background:var(--side);color:var(--side-ink);flex-direction:column;gap:18px;padding:20px 14px;min-height:0;overflow-y:auto}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px;font:700 19px var(--f-display);letter-spacing:-.01em;color:#fff}
.sadd{display:flex;align-items:center;justify-content:center;gap:8px;height:44px;border-radius:12px;background:var(--side-accent);color:#06251D;font-weight:600}
.sadd kbd{color:#06251D}
.snav{display:grid;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--side-muted);font-weight:500;text-align:left}
.snav button:hover{background:var(--side-hi);color:var(--side-ink)}
.snav button.on{background:var(--side-hi);color:#fff}
.sfoot{margin-top:auto;padding:12px;border-radius:12px;background:var(--side-hi);display:grid;gap:2px}
.sfoot span{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--side-muted)}
.sfoot b{font:700 18px var(--f-display);color:#fff;overflow-wrap:anywhere}
.sfoot p{margin:8px 0 0;font-size:12px;color:var(--side-muted)}
.sbp{margin-top:auto;display:grid;gap:10px}
.sbp .sfoot{margin-top:0;text-align:left;width:100%}
.sbp .sfoot.sbl{color:inherit;cursor:pointer}.sbp .sfoot.sbl:hover{background:rgba(255,255,255,.14)}
.sbbar{height:6px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;margin-top:6px}
.sbbar i{display:block;height:100%;border-radius:99px;background:var(--side-accent)}
.sbg{color:var(--side-accent)!important}.sbr{color:#ff9a90!important}
.sbln{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:13px;color:var(--side-ink);text-align:left;width:100%}
.sbln:hover{text-decoration:underline}
.sbln i{width:8px;height:8px;border-radius:50%;flex:none;background:#ff9a90}.sbln i.a{background:#e3b04b}
.row.upc{opacity:.6}.row.upc .amtc{font-style:italic}
.rcrow .rect{text-align:left;min-width:0;display:grid;gap:2px}
.pausetag{font-style:normal;font-size:11px;font-weight:700;color:var(--warn);background:rgba(168,105,26,.12);padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:1px}
.sbl2{display:block!important}
.sbl2 .ovr:nth-child(n){border-bottom:1px solid var(--line)}.sbl2 .ovr:last-child{border-bottom:0}

/* header */
.top{display:flex;align-items:center;flex-wrap:wrap;gap:8px 12px;padding-block:12px 8px;min-height:62px}
.top h1{margin:0;font:700 24px/1.1 var(--f-display);letter-spacing:-.015em;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center}
.ib:hover{background:var(--line)}
.ib[disabled]{opacity:.3;cursor:default;background:none}
.month{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;min-height:42px}
.month b{font:700 16px var(--f-display);min-width:136px;text-align:center}
.month .pl{font:700 16px var(--f-display);min-width:136px;text-align:center;white-space:nowrap;padding:0 8px;height:34px;border-radius:8px;color:var(--ink);cursor:pointer}.month .pl:hover{background:var(--line)}.month .pl:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent)}
.persel{height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--f-body,inherit);padding:0 12px;cursor:pointer;width:auto;max-width:none}
.dlgc label.incl{display:flex;align-items:center;gap:10px;font-weight:600;font-size:14px;color:var(--ink)}.dlgc label.incl input{width:20px;height:20px;min-width:20px;padding:0;accent-color:var(--accent);flex:none}
.persel:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.hadd{display:none;align-items:center;gap:6px;height:42px;padding:0 18px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600}
.mob{display:inline-grid}
.only-mob{display:none}
@media (max-width:899px){.mob-hide{display:none!important}.only-mob{display:block!important}}
@media (min-width:900px){.hadd{display:inline-flex}.mob{display:none}}
.seclabel{padding:14px 0 6px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
@media (max-width:899px){.top h1.hm{display:none}.top .month{flex:1}.top .month b,.top .month .pl{flex:1}}

/* shared */
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:18px;min-width:0}
.card h2{margin:0;font:700 16px var(--f-display);letter-spacing:-.005em}
.card .sub{margin:2px 0 12px;color:var(--muted);font-size:13px}
.chd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.lnk{color:var(--accent);font-weight:600;font-size:13px}
.g{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.lab{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:block}
.pos{color:var(--inc)} .neg{color:var(--exp)}
.empty{text-align:center;color:var(--muted);padding:34px 16px;border:1px dashed var(--line);border-radius:16px}
.banner{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--surface);border:1px dashed var(--muted);font-size:13px;color:var(--muted)}
.tipban{border:1px solid var(--line);border-left:3px solid var(--accent);align-items:flex-start;transition:opacity .5s}
.tipban.enter{animation:tipSlideIn .45s ease-out}
@keyframes tipSlideIn{from{opacity:0;transform:translateX(28px)}to{opacity:1;transform:translateX(0)}}
.tipban.fading{opacity:0}
.tipban span{color:var(--ink)}
.tipban b{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:3px}
.tiprow{display:flex;gap:10px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.tiprow:last-child{border-bottom:0}
.tiprow p{margin:0;flex:1;min-width:0;font-size:13.5px;line-height:1.45;color:var(--ink)}
.tipcat{flex:none;font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);margin-top:1px}
.tipcat.app{color:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{padding:7px 14px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pill{padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:13px}
.pill.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn{height:44px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:0 18px}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.ghost{background:transparent;color:var(--ink);border:1px dashed var(--muted)}
.btn.danger{color:var(--exp)}
.unsaved .btn.danger:not(.line){background:var(--exp);color:#fff;border-color:var(--exp)}
.btn.sm{height:36px;padding:0 14px;font-size:13px}
.track{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.track.warn i{background:var(--warn)} .track.over i{background:var(--exp)}
.track.thin{height:5px}
.goalg{grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;margin-top:6px}
.goal{display:grid;gap:8px;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.goal.mini{border:0;border-radius:0;background:none}
.goal .gmain{display:grid;gap:8px;width:100%;text-align:left;padding:16px}
.goal.mini .gmain{padding:6px 0}
.goal .h{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center}
.goal.mini .h{grid-template-columns:22px minmax(0,1fr) auto}
.goal .h b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal .pct{color:var(--muted);font-weight:600}
.goal .gm{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--muted)}
.goal .gm>span{min-width:0}
.goal .st{font-weight:700;white-space:nowrap}
.st.good{color:var(--inc)} .st.warn{color:var(--warn)} .st.bad{color:var(--exp)}
.track.good i{background:var(--inc)}
.goal .track{position:relative;overflow:visible}
.track .tick{position:absolute;top:-3px;bottom:-3px;width:2px;margin-left:-1px;border-radius:2px;background:var(--ink);text-decoration:none}
.gnote{color:var(--warn);font-size:12.5px;font-weight:600}
.gunote{color:var(--muted);font-size:12.5px;white-space:pre-wrap;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.gact{padding:0 16px 14px}.gact .btn{width:100%}
.ghist{margin:14px 0 4px;display:block}
.gh{display:flex;gap:14px}


/* icon dots */
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:#fff;flex:none}
.dot svg{width:20px;height:20px}
.dot.sm{width:28px;height:28px}.dot.sm svg{width:15px;height:15px}
.dot.xs{width:22px;height:22px}.dot.xs svg{width:12px;height:12px}
.dot.xf{background:var(--muted)}

/* kpis */
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:4px;min-width:0;align-content:start}
.kpi .kv{font:700 28px/1.15 var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpi .kv .kcur{font-size:.58em;font-weight:600;letter-spacing:.05em;opacity:.72;margin-right:.18em}
.kpi .kd{font-size:12.5px;color:var(--muted)}
.kpi.hero{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.kpi.hero .lab,.kpi.hero .kd{color:inherit;opacity:.82}
.dg{color:var(--inc);font-weight:600} .db{color:var(--exp);font-weight:600}
.kpi.hero .dg,.kpi.hero .db{color:inherit}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.stat b{display:block;font:700 18px var(--f-display);overflow-wrap:anywhere}

/* charts */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:11px var(--f-body)}
.chart .gl{stroke:var(--line);stroke-width:1}
.bi{fill:var(--inc)} .be{fill:var(--exp)}
.ln-a{stroke:var(--accent);fill:none;stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ln-b{stroke:var(--muted);fill:none;stroke-width:1.6;stroke-dasharray:4 4}
.ar-a{fill:var(--accent);opacity:.12}
.dt{fill:var(--accent);stroke:var(--surface);stroke-width:2}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-bottom:8px}
.key i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.key i.dash{height:0;border-top:2px dashed var(--muted);border-radius:0;width:16px;vertical-align:3px}

/* transaction rows */

.rows{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}

.rt .s{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ra{display:none}
.amtc small.acct{overflow:hidden;text-overflow:ellipsis;max-width:260px;margin-left:auto}
.ra{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amtc{font:600 15px var(--f-display);white-space:nowrap;text-align:right}
.amtc small{display:block;font:400 11.5px var(--f-body);color:var(--muted)}

.account-ledger-head{display:grid;grid-template-columns:minmax(0,1fr) 88px 105px;gap:10px;padding:8px 14px;color:var(--muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}

.row.account-row{grid-template-columns:36px minmax(0,1fr) 88px 105px;gap:10px;padding-inline:14px}
.balance-col{font:600 14px var(--f-display);text-align:right;white-space:nowrap}

@media (min-width:900px){
  .row{grid-template-columns:40px minmax(0,1fr) auto}
}

/* budgets, accounts, categories, currencies, settings */
.bud{display:grid;gap:8px;width:100%;text-align:left;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:16px}

.bmini{display:grid;gap:6px;width:100%;text-align:left;padding:6px 0}

.acard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;display:grid;gap:10px}

.setrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);flex-wrap:wrap}

.setrow p{margin:0;color:var(--muted);font-size:12.5px}
.mrow{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;width:100%;padding:16px;text-align:left;font-weight:600;border-bottom:1px solid var(--line)}
.mrow:last-child{border-bottom:0}
.sc{display:grid;grid-template-columns:auto 1fr;gap:8px 14px;align-items:center;color:var(--muted)}
.sc kbd{margin:0;color:var(--ink);justify-self:start}
.catc{display:grid;gap:4px;align-content:start}
.chead{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:12px;align-items:center;padding-bottom:10px;border-bottom:1px solid var(--line)}

.srow span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow em{font-style:normal;color:var(--muted);font-size:12.5px}
.cu{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}

.rcrow{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}

.rcrow small{display:block;color:var(--muted);font-size:12px}
.rcrow .t{min-width:0}.rcrow .t b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* tabs (phone) */
.tabs{display:grid;grid-template-columns:repeat(6,1fr);align-items:center;border-top:1px solid var(--line);background:var(--surface);padding-block:6px 8px}
.tabs button.t{display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--muted);padding:4px 0;min-width:0}
.tabs button.t span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.tabs button.t.on{color:var(--accent)}

/* sheet, dialogs */
#sheet,#dlg,#pick{position:absolute;inset:0;z-index:20}#pick{z-index:21}#dlg{z-index:22}
.scrim{position:absolute;inset:0;background:rgba(5,12,10,.55)}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:97%;background:var(--surface);border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%)}to{opacity:1;transform:translate(-50%,-50%)}}
.ph{display:flex;justify-content:space-between;align-items:center;padding-block:12px 6px}
.pb{overflow-y:auto;display:grid;gap:12px;padding-block:6px 12px;min-height:0}
.cur-select{border:0;background:transparent;color:var(--muted);font:600 13px var(--f-body);letter-spacing:.04em;padding:2px 24px 2px 0;max-width:none;width:auto;min-width:86px;outline:none;cursor:pointer}.cur-select:focus{color:var(--accent)}
#f-amt{width:100%;border:0;background:transparent;text-align:right;font:700 40px/1.1 var(--f-display);letter-spacing:-.015em;padding:0;min-width:0}

.amtbox{display:grid;gap:2px;border-bottom:2px solid var(--line);padding-bottom:6px}

.amtbox .row1{display:flex;align-items:baseline;gap:8px}
.amtbox .cur{font-size:13px;color:var(--muted);letter-spacing:.06em;font-weight:600}
.amtbox.exp #f-amt{color:var(--exp)} .amtbox.inc #f-amt{color:var(--inc)} .amtbox.xfer #f-amt{color:var(--xfer)}
.seg button.on[data-v="exp"]{color:var(--exp)} .seg button.on[data-v="inc"]{color:var(--inc)} .seg button.on[data-v="xfer"]{color:var(--xfer)}
#amt-prev{text-align:right;color:var(--muted);font-size:13px;min-height:19px}
.cats{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;gap:7px;align-items:center;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-weight:500;font-size:13px}
.chip.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--bg));color:var(--accent);box-shadow:none;font-weight:600}
.lh{display:flex;align-items:center;justify-content:space-between;gap:8px;white-space:nowrap;height:20px}.lh .quick{display:inline-flex;gap:10px;margin:0}.lh .quick button{min-height:0;height:20px;padding:0;line-height:20px}
.chip:focus{outline:none}.chip:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.pf .xl{display:flex;gap:2px}.pf .xl button{display:inline-flex;align-items:center;gap:6px;height:40px;padding:0 10px;border-radius:10px;font-weight:600;font-size:13px;color:var(--muted)}.pf .xl button:hover{background:var(--line)}.pf .xl .del{color:var(--exp);height:40px}
@media(max-width:700px){.pf .xl .t{display:none}.pf .xl button{padding:0 9px}}
.catfield{display:flex;align-items:center;gap:10px;width:100%;min-height:48px;padding:6px 12px 6px 8px;border-radius:12px;border:1px solid var(--line);background:var(--bg);text-align:left}
.catfield .cf .cl{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catfield .cf .cl b{font-weight:600}.catfield .cf .need{color:var(--muted);font-weight:500}
.catfield .cf{display:grid;min-width:0;flex:1}.catfield .cf b{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.catfield .cf small{color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.catfield:focus-visible{outline:2px solid color-mix(in srgb,var(--accent) 45%,transparent);outline-offset:2px}
.pkp{position:absolute;inset:0;background:var(--surface);display:flex;flex-direction:column;animation:up .2s ease-out}
.pkh{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.pkx{display:grid;min-width:0}.pkx b{font:700 17px var(--f-display)}.pkx small{color:var(--muted);font-size:12px}
.pks{padding:4px 12px 10px;border-bottom:1px solid var(--line)}
.pks input{width:100%;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 12px;min-width:0}
.pkb{flex:1;min-height:0;display:grid;grid-template-columns:42% 58%}
.pkl,.pkr,.pkres{overflow-y:auto;min-height:0}
.pkl{background:var(--bg);border-right:1px solid var(--line)}
.pkres{grid-column:1/-1}
.pkrow{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;background:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.pkrow .pkt{display:grid;min-width:0;flex:1}.pkrow .pkt b{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pkrow .pkt small{color:var(--muted);font-size:11.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pkl .pkrow.on{background:var(--surface);box-shadow:inset 3px 0 0 var(--accent);color:var(--accent)}
.pkr .pkrow.on,.pkres .pkrow.on{background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.pkrow .pkck{color:var(--accent);display:grid;place-items:center;font-weight:700}
.pkrow:hover{background:color-mix(in srgb,var(--accent) 6%,var(--surface))}
.pkadd{display:block;width:100%;text-align:left;padding:13px 14px;color:var(--accent);font-weight:600;font-size:13.5px;background:transparent}
.pkempty{padding:20px;color:var(--muted);font-size:13px;margin:0}
@media(min-width:700px){.pkp{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);width:min(680px,94%);height:min(600px,88%);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);overflow:hidden;animation:pop .18s ease-out}}
.chip.plain{padding:6px 12px}
.grp{display:grid;gap:6px}
.grp>.dl{display:block}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.keys button{height:48px;border-radius:14px;background:var(--bg);border:1px solid var(--line);font:600 20px var(--f-display)}

.pf{display:grid;grid-template-columns:auto;grid-auto-flow:column;grid-auto-columns:1fr;gap:8px;padding-block:12px 16px;border-top:1px solid var(--line);align-items:center}
@media(max-width:699px){.pf kbd{display:none}.pf{display:none}#sheet.note-focus .pf{display:grid}}
.del{color:var(--exp);font-weight:600;height:40px}
.xtra{display:flex;gap:16px;justify-content:center}
.xtra button{font-weight:600;color:var(--accent)}
.xtra .del{height:auto}
.dlgc{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(92%,420px);max-height:92%;overflow-y:auto;overflow-x:hidden;background:var(--surface);border-radius:20px;padding:20px;display:grid;gap:12px;border:1px solid var(--line);box-shadow:var(--shadow)}

.dv{display:grid;gap:12px}
.dv>div{display:grid;gap:2px}
.dv span{color:var(--muted);font-size:12.5px}
.dv b{font-weight:600;overflow-wrap:anywhere}
.dv .nt{font-weight:400;white-space:pre-wrap;line-height:1.45}
.dv .none{color:var(--muted);font-weight:400}
.dlgc textarea{width:100%;height:150px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:8px;font:12px/1.4 ui-monospace,monospace}
.dlgb{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dlgb.three{grid-template-columns:auto 1fr 1fr}
.unsaved{position:absolute;inset:0;z-index:30}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sw{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.swb{width:30px;height:30px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}

.dfield{position:relative;display:flex;align-items:center;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--bg);padding:0 10px;min-width:0;cursor:pointer;color:var(--ink);font-size:14px}

.icsearch{display:flex;align-items:center;gap:8px;margin-top:6px}.icprev{width:40px;height:40px;flex:none;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}.icsearch input{flex:1;min-width:0;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--bg);padding:0 12px;color:var(--ink)}.icnote{grid-column:1/-1;margin:2px 0 0;font-size:12px;color:var(--muted)}

.icb{height:40px;border-radius:10px;border:1px solid var(--line);display:grid;place-items:center;background:var(--bg)}
.icb.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dl{font-size:12px;color:var(--muted);font-weight:500}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:90px;z-index:30;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;font-weight:500;max-width:90%;box-shadow:0 8px 24px rgba(0,0,0,.3)}

/* ---------- data ---------- */
function addPeriod(ds,freq,day){
  var p=ds.split('-'),y=+p[0],m=+p[1]-1,d=+p[2];
  if(freq==='weekly')return iso(new Date(y,m,d+7));
  if(freq==='yearly'){var dm=new Date(y+1,m+1,0).getDate();return iso(new Date(y+1,m,Math.min(day||d,dm)))}
  var dm2=new Date(y,m+2,0).getDate();return iso(new Date(y,m+1,Math.min(day||d,dm2)));
}
var WDN=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],WDL=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function ordn(n){return n===-1?'last':['','1st','2nd','3rd','4th','5th'][n]}
function dparts(ds){var p=ds.split('-');return {y:+p[0],m:+p[1]-1,d:+p[2]}}
function dowOf(ds){var q=dparts(ds);return new Date(q.y,q.m,q.d).getDay()}
/* next date after `from` for a repeat rule r: {freq,n,wd,mm,nth,wdn,day} */
function nextOcc(r,from){
  var q=dparts(from),n=Math.max(1,r.n|0||1),f=r.freq;
  if(f==='daily')return iso(new Date(q.y,q.m,q.d+n));
  if(f==='weekly'){
    if(!r.wd||!r.wd.length)return iso(new Date(q.y,q.m,q.d+7*n));
    var start=new Date(q.y,q.m,q.d),ws=new Date(q.y,q.m,q.d-((start.getDay()+6)%7));
    for(var i=1;i<=7*n+7;i++){var t=new Date(q.y,q.m,q.d+i);if(r.wd.indexOf(t.getDay())>=0&&Math.floor(Math.round((t-ws)/864e5)/7)%n===0)return iso(t)}
  }
  var months=f==='yearly'?12*n:n,tot=q.y*12+q.m+months,ny=Math.floor(tot/12),nm=tot%12,last=new Date(ny,nm+1,0).getDate(),day=Math.min(r.day||q.d,last);
  if(f==='monthly'&&r.mm==='last')day=last;
  else if(f==='monthly'&&r.mm==='nth'&&r.nth){
    if(r.nth===-1)day=last-((new Date(ny,nm,last).getDay()-r.wdn+7)%7);
    else day=Math.min(last,1+((r.wdn-new Date(ny,nm,1).getDay()+7)%7)+7*(r.nth-1));
  }
  return iso(new Date(ny,nm,day));
}
function recDone(r){return (r.cnt>0&&(r.done||0)>=r.cnt)||(!!r.end&&r.next>r.end)}
function describeRule(r){
  var n=Math.max(1,r.n|0||1),u={daily:'day',weekly:'week',monthly:'month',yearly:'year'}[r.freq],h=n===1?'Every '+u:'Every '+n+' '+u+'s';
  if(r.freq==='weekly'&&r.wd&&r.wd.length){h+=' on '+r.wd.slice().sort(function(a,b){return ((a+6)%7)-((b+6)%7)}).map(function(d){return WDN[d]}).join(', ')}
  if(r.freq==='monthly'){h+=r.mm==='last'?' on the last day':r.mm==='nth'?' on the '+ordn(r.nth)+' '+WDL[r.wdn]:' on day '+r.day}
  if(r.end)h+=', until '+fmtDate(r.end);
  if(r.cnt>0)h+=', '+r.cnt+' times in total';
  return h;
}
/* build a rule from the open transaction form; returns an error string when the form is not valid */
function firstNext(r,date){
  var q=dparts(date);
  if(r.freq==='monthly'&&!r.mm&&(r.n||1)===1&&r.day>q.d){return iso(new Date(q.y,q.m,Math.min(r.day,new Date(q.y,q.m+1,0).getDate())))}
  return nextOcc(r,date);
}
function repeatRule(E){
  var f=E.repeat;if(!f)return null;
  var n=parseInt(E.rn||'1',10);if(!(n>=1))return 'Repeat every: enter 1 or more';
  var q=dparts(E.date),r={freq:f,n:n,day:q.d};
  if(f==='weekly'){r.wd=(E.rwd&&E.rwd.length?E.rwd:[dowOf(E.date)]).slice();}

  function apply(){var b=vals.pop(),a=vals.pop(),o=ops.pop();if(o==='+')vals.push(a+b);else if(o==='-')vals.push(a-b);else if(o==='*')vals.push(a*b);else if(o==='/')vals.push(b===0?NaN:a/b)}
  function prec(o){return o==='*'||o==='/'?2:1}
  var expect=true;
  tokens.forEach(function(t){
    if(/^[+\-*/]$/.test(t)){
      if(expect&&(t==='+'||t==='-')){vals.push(0);ops.push(t);return}
      while(ops.length&&prec(ops[ops.length-1])>=prec(t))apply();

}

function runRecurring(){

  S.recurring.forEach(function(r){
    var guard=0;
    while(r.next<=today&&!recDone(r)&&guard++<600){
      var a=acct(r.tpl.acc);if(!a)break;
      var xf=r.tpl.type==='xfer',b=xf&&r.tpl.to?acct(r.tpl.to):null;
      if(xf&&!b)break;

      made++;if(r.cnt>0)r.done=(r.done||0)+1;r.next=nextOcc(r,r.next);

  var saved=gSaved(g),rem=Math.max(0,g.target-saved);

  if(done){o.word=beh==='pay'?'Cleared':'Reached';o.cls='good';o.tword=g.by?gEarly(g,g.done):'';return o}

(function(){
  var sx=0,sy=0,tracking=false;
  function tabsVisible(){var tb=$('#tabs');return tb&&getComputedStyle(tb).display!=='none'};
  function onStart(e){
    if(U.sheet||U.pick||U.dlg)return;
    if(!tabsVisible())return;
    if(TABS.map(function(x){return x[0]}).indexOf(U.view)<0)return;
    if(U.view==='tx'&&scopedAccId())return;
    var t=e.touches?e.touches[0]:e;sx=t.clientX;sy=t.clientY;tracking=true;
  }
  function onEnd(e){
    if(!tracking)return;tracking=false;
    var t=e.changedTouches?e.changedTouches[0]:e,dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy)*1.5)return;
    var order=TABS.map(function(x){return x[0]}),i=order.indexOf(U.view);
    if(i<0)return;
    var ni=dx<0?i+1:i-1;
    if(ni<0||ni>=order.length)return;
    U.view=order[ni];render();
  }
  var sc=$('#screen');
  sc.addEventListener('touchstart',onStart,{passive:true});
  sc.addEventListener('touchend',onEnd,{passive:true});
})();
document.addEventListener('keydown',function(e){
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  var tg=e.target,tag=(tg.tagName||'').toLowerCase(),typing=tag==='input'||tag==='select'||tag==='textarea';
  if((U.dlg||U.sheet)&&e.key==='Escape'&&document.querySelector('.unsaved')){A.keepEditing();return}
  if(U.dlg){if(e.key==='Escape')A.closeDlg();else if(e.key==='Enter'&&tag==='input'){var s=$('#dlg .dlgb .btn:last-child');if(s)s.click()}return}
  if(U.pick){
    if(e.key==='Escape'){A.closePick();return}
    if(pickNav(e,tg))return;
    if(e.key==='Enter'&&tag==='input'){var fr=document.querySelector('#pk-body .pkres .pkrow');if(fr){e.preventDefault();fr.click()}}
    return;
  }
  if(U.sheet){
    if(e.key==='Escape'){A.closeSheet();return}
    if(e.key==='Enter'&&tag==='input'&&tg.type!=='search'){e.preventDefault();saveTx(e.shiftKey&&!U.sheet.id);return}
    if(typing)return;
    if(/^\d$/.test(e.key)||e.key==='+'||e.key==='-'||e.key==='.')key(e.key);
    else if(e.key==='Backspace')key('bk');
    return;
  }
  if(typing){if(e.key==='Escape')tg.blur();return}
  if(e.key==='n'||e.key==='N'){e.preventDefault();openSheet(null)}
  else if(e.key==='/'){e.preventDefault();if(U.view!=='tx'){U.view='tx';render()}var q=$('#q');if(q)q.focus()}
  else if(e.key==='['&&MONTHLY[U.view]&&(U.view!=='reports'||U.r.period==='month'))A.prev();

});
